name: Update Profile Art

on:
  schedule:
    - cron: "0 0 * * *" # Run daily
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          
      - name: Fetch Contributions
        env:
          GH_PROFILE_USER: Bhagyaprasad92
        run: |
          python scripts/fetch_contributions.py
          
      - name: Render Heatmap SVG
        run: |
          python scripts/render_heatmap_svg.py
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/contributions.json contrib-heatmap.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update contribution graph" && git push)
