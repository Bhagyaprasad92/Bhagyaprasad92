name: Guestbook Updater

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write

jobs:
  update-guestbook:
    if: contains(github.event.issue.body, '### Your Message')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Update Guestbook
        env:
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/update_guestbook.py
          
      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/guestbook.json README.md
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "docs: add @${{ github.event.issue.user.login }} to guestbook"
          
          for i in {1..3}; do
            if git pull --rebase origin main; then
              if git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main; then
                echo "Push succeeded"
                exit 0
              fi
            else
              echo "Rebase failed on attempt $i"
              git rebase --abort || true
            fi
            
            if [ $i -lt 3 ]; then
              echo "Retry attempt $((i+1))..."
              sleep $((i * 5))
            fi
          done
          
          echo "Failed to push after 3 attempts"
          exit 1
          
      - name: Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "Thanks for signing the guestbook! 🚀 Your signature has been added to my profile."
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "closed"
            });
