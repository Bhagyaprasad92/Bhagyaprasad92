name: Update Profile Art

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Run daily
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          
      - name: Fetch Contributions
        env:
          GH_PROFILE_USER: Bhagyaprasad92
        run: |
          python scripts/fetch_contributions.py
          
      - name: Render Heatmap SVG
        run: |
          python scripts/render_heatmap_svg.py
          
      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/contributions.json contrib-heatmap.svg
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "chore: update contribution graph"
          git fetch origin main
          
          if ! git rebase origin/main; then
            echo "Rebase failed — aborting and exiting (manual resolve required)"
            git rebase --abort || true
            exit 1
          fi
          
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main --force-with-lease
